name: Build and minify CSS

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'themes/**'
      - 'sizes/**'
      - 'scripts/build.js'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pin clean-css-cli for reproducible builds
      - name: Install clean-css-cli
        run: npm install -g clean-css-cli@5

      # Writes frond.css, frond.frame.css, and dist/frond.full.css (unminified)
      - name: Concatenate src/ into frond.css, frond.frame.css, dist/frond.full.css
        run: node scripts/build.js

      # --- Individually minified bundles (banners preserved via /*! ... */) ---
      - name: Minify frond.css
        run: cleancss -o dist/frond.min.css frond.css

      - name: Minify frond.frame.css
        run: cleancss -o dist/frond.frame.min.css frond.frame.css

      - name: Minify full bundle
        run: cleancss -o dist/frond.full.min.css dist/frond.full.css

      # GitHub Pages serves docs/ only — copy the current CSS/themes/sizes/vendor
      # in so the docs site never references anything outside its own folder.
      - name: Sync docs/ assets
        run: node scripts/sync-docs.js

      - name: Commit build outputs
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frond.css frond.frame.css dist/ docs/
          git diff --staged --quiet || git commit -m "Auto-build CSS dist [skip ci]"
          git push
