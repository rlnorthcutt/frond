name: Build and minify CSS

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'themes/**'
      - 'sizes/**'
      - 'scripts/build.js'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pin clean-css-cli for reproducible builds
      - name: Install clean-css-cli
        run: npm install -g clean-css-cli@5

      - name: Concatenate src/ into frond.css and frond.frame.css
        run: node scripts/build.js

      - name: Create dist directory
        run: mkdir -p dist

      # --- Individually minified bundles (banners preserved via /*! ... */) ---
      - name: Minify frond.css
        run: cleancss -o dist/frond.min.css frond.css

      - name: Minify frond.frame.css
        run: cleancss -o dist/frond.frame.min.css frond.frame.css

      # --- Combined FULL bundle (core + frame, non-minified and minified) ---
      - name: Create non-minified full bundle
        run: cat frond.css frond.frame.css > dist/frond.full.css

      - name: Minify full bundle
        run: cleancss -o dist/frond.full.min.css dist/frond.full.css

      - name: Commit build outputs
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frond.css frond.frame.css dist/
          git diff --staged --quiet || git commit -m "Auto-build CSS dist [skip ci]"
          git push
